name: Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without v-prefix (e.g. 1.2.3). If provided, sets pom.xml version before building.'
        required: false
        type: string
        default: ''
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set release version
        if: inputs.version != ''
        run: mvn versions:set -DnewVersion=${{ inputs.version }} --no-transfer-progress

      - name: Build and run unit tests
        run: mvn verify -Dtest='!com.wandocorp.nytscorebot.EndToEndTest' --batch-mode --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: nyt-scorebot-app/target/nyt-scorebot-app-*.jar
          retention-days: 7
