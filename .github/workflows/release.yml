name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: 'Version tag (e.g., v1.2.3)'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Collect commits since the previous semver tag BEFORE we create the new one,
      # so the release notes don't include the version-bump commit itself.
      - name: Collect commits since last release
        id: commits
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -n "$PREV_TAG" ]; then
            echo "Using commits since tag: $PREV_TAG"
            git log --no-merges --pretty=format:'- %s' "${PREV_TAG}..HEAD" > commits.txt
          else
            echo "No previous semver tag found; using last 50 commits"
            git log --no-merges --pretty=format:'- %s' -n 50 > commits.txt
          fi
          echo "--- Commits to summarise ---"
          cat commits.txt
          echo "----------------------------"

      # Java is always required: for mvn versions:set and the fallback JAR build.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set release version in pom.xml
        run: |
          MAVEN_VERSION="${{ inputs.version }}"
          MAVEN_VERSION="${MAVEN_VERSION#v}"
          mvn versions:set -DnewVersion="$MAVEN_VERSION" --no-transfer-progress

      # Commit pom.xml version bump, tag, and push to main.
      # [skip ci] prevents this commit from triggering a new pipeline run.
      - name: Commit version bump and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $(find . -name 'pom.xml' -not -path '*/target/*')
          if git diff --cached --quiet; then
            echo "pom.xml already at version ${{ inputs.version }}; skipping commit"
          else
            git commit -m "chore: release ${{ inputs.version }} [skip ci]"
          fi
          git tag ${{ inputs.version }}
          git push origin HEAD:main
          git push origin ${{ inputs.version }}

      - name: Download JAR artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: release-staging
        continue-on-error: true

      # If the pre-built artifact isn't available the JAR is rebuilt here.
      # pom.xml is already set to the release version above, so the JAR filename
      # will be nyt-scorebot-app-X.Y.Z.jar.
      - name: Build JAR (fallback)
        if: steps.download.outcome == 'failure'
        run: |
          mvn clean package -DskipTests --batch-mode --no-transfer-progress
          mkdir -p release-staging
          cp nyt-scorebot-app/target/nyt-scorebot-app-*.jar release-staging/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: false
          body_path: commits.txt
          files: release-staging/nyt-scorebot-app-*.jar

