name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run for the same ref when a new push arrives.
# For push-to-main this ensures only the latest commit waits at the approval
# gate, so a reviewer approves once and gets all accumulated PR commits.
# PR runs each have a unique ref so they are unaffected.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  test:
    name: Test (E2E)
    needs: build
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/test.yml
    secrets:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

  # Manual approval gate — pauses the pipeline until a reviewer approves in the
  # GitHub Actions UI. Requires a "production" environment configured in repo
  # Settings → Environments with at least one required reviewer.
  approve:
    name: Approve Release
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release approved"

  release:
    name: Release
    needs: approve
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: v${{ github.run_number }}

  deploy:
    name: Deploy
    needs: release
    uses: ./.github/workflows/deploy.yml
    secrets:
      PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
      PI_HOST: ${{ secrets.PI_HOST }}
      PI_USER: ${{ secrets.PI_USER }}
      PI_SSH_PORT: ${{ secrets.PI_SSH_PORT }}
      PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
      PI_SERVICE_NAME: ${{ secrets.PI_SERVICE_NAME }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}

  announce:
    name: Announce
    needs: deploy
    uses: ./.github/workflows/announce.yml
    with:
      version: v${{ github.run_number }}
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
